name: Release

# Every push to main checks the version in Resources/Info.plist (CFBundleShortVersionString).
# If there is no release for it yet, this builds a universal DMG and publishes release vX.Y.Z
# (creating the tag) whose only download is the DMG installer. To ship a new version: bump it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      # Signing + notarization run only when these repository secrets exist (see docs/NOTARIZATION.md).
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.NOTARY_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists, nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Use the latest stable Xcode (Liquid Glass + Icon Composer need Xcode 26)
        if: steps.version.outputs.skip != 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install create-dmg
        if: steps.version.outputs.skip != 'true'
        run: brew install create-dmg

      - name: Import Developer ID certificate
        if: steps.version.outputs.skip != 'true' && env.HAS_SIGNING == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build app
        if: steps.version.outputs.skip != 'true'
        run: |
          chmod +x build.sh make-dmg.sh
          UNIVERSAL=1 VERSION="${{ steps.version.outputs.version }}" BUILD_NUMBER="$GITHUB_RUN_NUMBER" ./build.sh

      - name: Package DMG
        if: steps.version.outputs.skip != 'true'
        run: ./make-dmg.sh

      - name: Sign, notarize and staple DMG
        if: steps.version.outputs.skip != 'true' && env.HAS_SIGNING == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          DMG=$(ls build/Headshare-*.dmg)
          codesign --force --timestamp --sign "$SIGN_IDENTITY" "$DMG"
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool submit "$DMG" --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait --timeout 30m
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"
          rm "$RUNNER_TEMP/notary.p8"

      - name: Publish release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Headshare ${{ steps.version.outputs.version }}
          files: build/Headshare-*.dmg
          body: |
            ## 🇬🇧 English
            **Download the `.dmg` file below**, open it and drag Headshare into Applications.

            First launch: macOS may say it can't verify the developer (the app isn't notarized yet). Open **System Settings › Privacy & Security** and click **Open Anyway**, or run `xattr -dr com.apple.quarantine /Applications/Headshare.app` once.

            Requires macOS 14 Sonoma or later · Apple Silicon and Intel · 34 languages.

            ## 🇮🇹 Italiano
            **Scarica il file `.dmg` qui sotto**, aprilo e trascina Headshare in Applicazioni.

            Primo avvio: macOS potrebbe dire che non può verificare lo sviluppatore (l'app non è ancora notarizzata). Apri **Impostazioni di Sistema › Privacy e sicurezza** e clicca **Apri comunque**, oppure esegui una volta `xattr -dr com.apple.quarantine /Applications/Headshare.app`.

            Richiede macOS 14 Sonoma o successivo · Apple Silicon e Intel · 34 lingue.

